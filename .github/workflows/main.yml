name: Test

on: [push]

jobs:
  test-build:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      APP_NAME: Mi Aplicación
      VERSION: 1.0.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: list files
        run: |
          ls -l

      - name: Run Local Action
        uses: ./.github/actions/my-action
        with:
          message: "Hello world"

      - name: Mostrar Variables de Entorno
        env:
          STEP_VARIABLE: "Esta es una variable solo de este step"
          API_KEY: "mi-api-key-secreta"
        run: |
          echo "Variables de entorno del job:"
          echo "NODE_ENV = $NODE_ENV"
          echo "APP_NAME = $APP_NAME"
          echo "VERSION = $VERSION"
          echo ""
          echo "Variables de entorno del step:"
          echo "STEP_VARIABLE = $STEP_VARIABLE"
          echo "API_KEY = $API_KEY"