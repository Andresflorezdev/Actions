name: Test

on: [push]

jobs:
  test-build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: list files
        run: |
          ls -l

      - name: Run Local Action
        uses: ./.github/actions/my-action
        with:
          message: "Hello world"

      - name: Test Redis Service
        run: |
          echo "Probando conexión con Redis..."
          sudo apt-get update
          sudo apt-get install -y redis-tools
          redis-cli -h localhost -p 6379 ping
          redis-cli -h localhost -p 6379 set test "Servicio funcionando!"
          redis-cli -h localhost -p 6379 get test
          echo "✅ Redis está funcionando correctamente"